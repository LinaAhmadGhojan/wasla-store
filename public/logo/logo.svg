  <line x1="52" y1="66" x2="108" y2="66" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- نقاط الشبكة (3×2) -->
  <rect x="75" y="98"  width="11" height="11" rx="2.5" fill="white"/>
  <rect x="95" y="98"  width="11" height="11" rx="2.5" fill="white"/>
  <rect x="115" y="98" width="11" height="11" rx="2.5" fill="white"/>
  <rect x="75" y="116" width="11" height="11" rx="2.5" fill="white"/>
  <rect x="95" y="116" width="11" height="11" rx="2.5" fill="white"/>
  <rect x="115" y="116" width="11" height="11" rx="2.5" fill="white"/>
  <!-- خطوط السرعة يسار الحقيبة -->
  <line x1="18" y1="98"  x2="62" y2="98"  stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="12" y1="113" x2="62" y2="113" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="18" y1="128" x2="62" y2="128" stroke="white" stroke-width="5.5" stroke-linecap="round"/>
  <!-- كلمة وصلة -->
  <text x="80" y="172"
    font-family="Tahoma, Arial, sans-serif"
